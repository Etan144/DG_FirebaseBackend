<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Deepfake Guard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .form-container {
      width: 400px;
      margin: 0 auto;
      text-align: left;
    }
    .form-container h1 {
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #2c3e50;
      background: #03101a;
      color: white;
      box-sizing: border-box; /* Ensures padding doesn't affect width */
    }
    .feedback {
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a href="index.html" class="brand" style="text-decoration: none; color: inherit;">
        <div class="logo">DG</div>
        <div>
          <div style="font-weight:700; letter-spacing:-0.02em;">Deepfake Guard</div>
          <div style="color:var(--muted); font-size:12px;">Deepfake call protection</div>
        </div>
      </a>
      <nav>
        <a href="index.html#product">Product</a>
        <a href="index.html#features">Features</a>
        <a href="index.html#how">How it works</a>
        <a href="index.html#faq">FAQ</a>
      </nav>
      <div class="cta">
        <a class="btn primary" href="LoginPage.html">Login</a>
      </div>
    </header>

    <section class="hero">
        <div class="form-container">
            <h1>Create Account</h1>
            
            <!-- Registration Form -->
            <form id="register-form" style="display: block;">
              <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
              </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <small style="color: var(--muted); display: block; margin-top: 4px;">
                      Password must contain: uppercase, lowercase, number, and special character (!@#$%^&*)
                    </small>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <button type="submit" class="btn primary" style="width:100%;">Register</button>
            </form>

            <div id="feedback-message" class="feedback"></div>
        </div>
    </section>

    <footer>
      &copy; 2024 Deepfake Guard. All rights reserved.
    </footer>
  </div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAC5WR-WL372sG418miEF9uN6Ic_jPv9OA",
    authDomain: "fyp-deepfakeguard.firebaseapp.com",
    projectId: "fyp-deepfakeguard"
  };

  const app = initializeApp(firebaseConfig);
  const functions = getFunctions(app);
  const registerUser = httpsCallable(functions, "registerUser");

  const form = document.getElementById("register-form");
  const feedback = document.getElementById("feedback-message");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm-password").value;

    if (password !== confirm) {
      feedback.textContent = "Passwords do not match";
      feedback.style.color = "red";
      return;
    }

    feedback.textContent = "Creating account...";
    feedback.style.color = "var(--muted)";

    try {
      await registerUser({
        email,
        password,
        username,
        displayName: username
      });

      feedback.textContent =
        "Account created! Please verify your email before logging in.";
      feedback.style.color = "var(--accent)";

      setTimeout(() => {
        window.location.href = "LoginPage.html";
      }, 2000);

    } catch (err) {
      feedback.textContent = err.message || "Registration failed";
      feedback.style.color = "red";
    }
  });
</script>






</body>
</html>
