<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Deepfake Guard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
</head>

<body>
  <div class="page">
    <header>
      <a href="index.html" class="brand" style="text-decoration:none;color:inherit;">
        <div class="logo">DG</div>
        <div>
          <div style="font-weight:700;">Deepfake Guard</div>
          <div style="color:var(--muted);font-size:12px;">Deepfake call protection</div>
        </div>
      </a>
    </header>

    <div class="form-container">
      <h2>Login to Your Account</h2>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>

        <button type="submit" class="btn primary" style="width:100%;">
          Login
        </button>
      </form>

      <div id="feedback-message" class="feedback"></div>

      <div class="form-links">
        <p>Don't have an account? <a href="RegistrationPage.html">Register here</a></p>
      </div>
    </div>

    <footer>
      &copy; 2024 Deepfake Guard. All rights reserved.
    </footer>
  </div>

  <!-- Firebase logic -->
  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      sendEmailVerification
    } from
      "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import {
      getFunctions,
      httpsCallable
    } from
      "https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAC5WR-WL372sG418miEF9uN6Ic_jPv9OA",
      authDomain: "fyp-deepfakeguard.firebaseapp.com",
      projectId: "fyp-deepfakeguard"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const functions = getFunctions(app);
    const claimUsername = httpsCallable(functions, "claimUsername");
    const checkSendVerificationOnFirstLogin = httpsCallable(functions, "checkSendVerificationOnFirstLogin");

    const form = document.getElementById("login-form");
    const feedback = document.getElementById("feedback-message");
    const submitBtn = form.querySelector("button");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";
      feedback.textContent = "Logging in...";
      feedback.style.color = "var(--muted)";

      try {
        const cred = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        // Check if verification email should be sent (admin first-login)
        try {
          const verificationCheck = await checkSendVerificationOnFirstLogin();
          if (verificationCheck.data.shouldSend) {
            await sendEmailVerification(cred.user);
            feedback.textContent = verificationCheck.data.message;
            feedback.style.color = "var(--accent)";
            await auth.signOut();
            submitBtn.disabled = false;
            submitBtn.textContent = "Login";
            return;
          }
        } catch (verificationErr) {
          console.error("Verification check failed:", verificationErr);
          // Continue with normal login flow
        }

        if (!cred.user.emailVerified) {
          feedback.textContent =
            "Please verify your email before logging in.";
          feedback.style.color = "red";
          return;
        }

        // 🔑 Finalise registration (claim username if pending)
        const pendingUsername =
          localStorage.getItem("pendingUsername");

        if (pendingUsername) {
          await claimUsername({username: pendingUsername});
          localStorage.removeItem("pendingUsername");
        }

        feedback.textContent = "Login successful!";
        feedback.style.color = "var(--accent)";

        setTimeout(() => {
          // Check for admin custom claim
          cred.user.getIdTokenResult().then((idTokenResult) => {
            if (idTokenResult.claims.admin) {
              window.location.href = "admin-dashboard.html";
            } else {
              window.location.href = "download.html";
            }
          }).catch(() => {
            // fallback to normal user
            window.location.href = "download.html";
          });
        }, 1000);

      } catch (err) {
        console.error(err);
        feedback.textContent = "Invalid email or password.";
        feedback.style.color = "red";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
