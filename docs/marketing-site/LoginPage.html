<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Deepfake Guard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">



  <style>
    .form-container {
      width: 400px;
      margin: 50px auto 0;
      text-align: left;
      background: rgba(15, 31, 55, 0.5);
      padding: 40px;
      border-radius: 8px;
      border: 1px solid rgba(52, 152, 219, 0.2);
    }
    .form-container h2 {
      text-align: center;
      margin-bottom: 30px;
      color: var(--accent);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #2c3e50;
      background: #03101a;
      color: white;
      box-sizing: border-box;
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(15, 31, 55, 0.8);
    }
    .feedback {
      margin-top: 16px;
      text-align: center;
      min-height: 20px;
      font-size: 14px;
    }
    .form-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
    .form-links a {
      color: var(--accent);
      text-decoration: none;
    }
    .form-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a href="index.html" class="brand" style="text-decoration: none; color: inherit;">
        <div class="logo">DG</div>
        <div>
          <div style="font-weight:700; letter-spacing:-0.02em;">Deepfake Guard</div>
          <div style="color:var(--muted); font-size:12px;">Deepfake call protection</div>
        </div>
      </a>
      <nav>
        <a href="index.html#product">Product</a>
        <a href="index.html#features">Features</a>
        <a href="index.html#how">How it works</a>
        <a href="index.html#faq">FAQ</a>
      </nav>
      <div class="cta">
      </div>
    </header>

    <div class="form-container">
      <h2>Login to Your Account</h2>
      <form id="login-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <button type="submit" class="btn primary" style="width: 100%;">Login</button>
        </div>
      </form>
      <div id="feedback-message" class="feedback"></div>
      <div class="form-links">
        <p>Don't have an account? <a href="RegistrationPage.html">Register here</a></p>
      </div>
    </div>

    <footer>
      &copy; 2024 Deepfake Guard. All rights reserved.
    </footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import {getAuth,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAC5WR-WL372sG418miEF9uN6Ic_jPv9OA",
      authDomain: "fyp-deepfakeguard.firebaseapp.com",
      databaseURL: "https://fyp-deepfakeguard-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "fyp-deepfakeguard",
      storageBucket: "fyp-deepfakeguard.firebasestorage.app",
      messagingSenderId: "5675548760",
      appId: "1:5675548760:web:a55e537ee4cff9df4aca2d",
      measurementId: "G-7QFKWZRZRS"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);

    // expose helpers
    window.firebaseLogin = signInWithEmailAndPassword;
  </script>

  <script type="module">
    const form = document.getElementById("login-form");
    const feedback = document.getElementById("feedback-message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      feedback.textContent = "Logging in...";
      feedback.style.color = "var(--muted)";

      try {
        // IMPORTANT: Firebase Auth uses EMAIL, not username
        const cred = await window.firebaseLogin(
          window.auth,
          email,
          password
        );

        if (!cred.user.emailVerified) {
          feedback.textContent = "Please verify your email before logging in.";
          feedback.style.color = "red";
          return;
        }

        feedback.textContent = "Login successful!";
        feedback.style.color = "var(--accent)";

        setTimeout(() => {
          window.location.href = "download.html";
        }, 1000);

      } catch (err) {
        feedback.textContent = err.message;
        feedback.style.color = "red";
      }
    });
  </script>


</body>
</html>
