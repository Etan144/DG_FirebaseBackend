<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Deepfake Guard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header>
      <div class="brand-row" style="display:flex;align-items:center;justify-content:space-between;width:100%;">
        <a href="index.html" class="brand" style="text-decoration:none;color:inherit;">
          <div class="logo">DG</div>
          <div>
            <div style="font-weight:700;">Deepfake Guard</div>
            <div style="color:var(--muted);font-size:12px;">Admin Dashboard</div>
          </div>
        </a>
        <div id="user-icon-container" style="margin-left:auto;display:flex;align-items:center;gap:10px;"></div>
      <!-- user icon and dropdown will be rendered here -->
      </div>
    </header>
    <div class="form-container">
      <div style="color:var(--muted);font-size:1.15rem;margin:18px 0 18px 0;">Welcome, Admin!</div>
    <div class="form-container">
      <div class="admin-section" id="admin-users-section">
        <h3>User Account Management</h3>
        <div id="users-loading">Loading users...</div>
        <table id="users-table" style="width:100%;margin-top:12px;display:none;">
          <thead>
            <tr>
              <th>Email</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
      <div class="admin-section" id="admin-reviews-section">
        <h3>Review Management</h3>
        <div id="reviews-loading">Loading reviews...</div>
        <div id="reviews-scroll" class="admin-review-scroll" style="display:none;"></div>
      </div>
    </div>
    <footer>
      &copy; 2024 Deepfake Guard. All rights reserved.
    </footer>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js";
    import { getFirestore, collection, getDocs, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { getUserIcon } from "./usericon.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAC5WR-WL372sG418miEF9uN6Ic_jPv9OA",
      authDomain: "fyp-deepfakeguard.firebaseapp.com",
      projectId: "fyp-deepfakeguard"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const functions = getFunctions(app);
    const db = getFirestore(app);
    const userIconContainer = document.getElementById("user-icon-container");
    // --- USER MANAGEMENT PANEL ---
    async function loadUsers() {
      const usersLoading = document.getElementById("users-loading");
      const usersTable = document.getElementById("users-table");
      const usersTbody = document.getElementById("users-tbody");
      usersLoading.textContent = "Loading users...";
      usersTable.style.display = "none";
      try {
        const listUsers = httpsCallable(functions, "listUsers");
        const res = await listUsers();
        usersTbody.innerHTML = "";
        res.data.forEach(user => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${user.email}</td>
            <td>${user.disabled ? '<span style="color:red;">Disabled</span>' : '<span style="color:var(--accent);">Active</span>'}</td>
            <td>
              <button class="btn secondary" data-action="disable" data-uid="${user.uid}" style="margin-right:6px;">${user.disabled ? 'Enable' : 'Disable'}</button>
              <button class="btn" data-action="delete" data-uid="${user.uid}" style="background:#c00;color:#fff;">Delete</button>
            </td>
          `;
          usersTbody.appendChild(tr);
        });
        usersLoading.style.display = "none";
        usersTable.style.display = "table";
      } catch (e) {
        usersLoading.textContent = "Failed to load users.";
      }
    }

    // Handle user actions
    document.addEventListener("click", async (e) => {
      if (e.target.matches('[data-action="disable"]')) {
        const uid = e.target.getAttribute('data-uid');
        const disable = e.target.textContent === 'Disable';
        if (confirm(`Are you sure you want to ${disable ? 'disable' : 'enable'} this user?`)) {
          const setUserDisabled = httpsCallable(functions, "setUserDisabled");
          await setUserDisabled({ uid, disabled: disable });
          loadUsers();
        }
      }
      if (e.target.matches('[data-action="delete"]')) {
        const uid = e.target.getAttribute('data-uid');
        if (confirm('Are you sure you want to permanently delete this user?')) {
          const deleteUser = httpsCallable(functions, "deleteUser");
          await deleteUser({ uid });
          loadUsers();
        }
      }
    });

    // --- REVIEW MANAGEMENT PANEL ---
    async function loadReviews() {
      const reviewsLoading = document.getElementById("reviews-loading");
      const reviewsScroll = document.getElementById("reviews-scroll");
      reviewsLoading.textContent = "Loading reviews...";
      reviewsScroll.style.display = "none";
      try {
        // Get all reviews from Firestore
        const snapshot = await getDocs(collection(db, 'reviews'));
        reviewsScroll.innerHTML = "";
        snapshot.forEach(docSnap => {
          const review = docSnap.data();
          const dateString = review.createdAt ? new Date(review.createdAt.seconds ? review.createdAt.seconds * 1000 : review.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
          // Build stars
          let stars = '';
          for (let i = 0; i < (review.rating || 0); i++) stars += '★';
          for (let i = (review.rating || 0); i < 5; i++) stars += '<span style="color:#222;">★</span>';
          // Build review card
          const card = document.createElement('div');
          card.className = 'admin-review-card';
          card.innerHTML = `
            <div class="admin-review-header">
              <span class="admin-review-stars">${stars}</span>
              <span class="admin-review-user">${review.displayName || (review.anonymous ? 'Customer Review' : 'Customer')}</span>
              <span class="admin-review-date">${dateString}</span>
            </div>
            <div style="margin: 4px 0 0 0; color: var(--text); font-size: 15px;">${review.description ? review.description : ''}</div>
            <div class="admin-review-actions">
              <button class="btn" data-action="delete-review" data-id="${docSnap.id}" style="background:#c00;color:#fff;">Delete</button>
            </div>
          `;
          reviewsScroll.appendChild(card);
        });
        reviewsLoading.style.display = "none";
        reviewsScroll.style.display = "flex";
      } catch (e) {
        reviewsLoading.textContent = "Failed to load reviews.";
      }
    }

    document.addEventListener("click", async (e) => {
      if (e.target.matches('[data-action="delete-review"]')) {
        const reviewId = e.target.getAttribute('data-id');
        if (confirm('Are you sure you want to delete this review?')) {
          const deleteReview = httpsCallable(functions, "adminDeleteReview");
          await deleteReview({ reviewId });
          loadReviews();
        }
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Render user icon and dropdown
        userIconContainer.innerHTML = `
          <div class="user-dropdown" id="userDropdown">
            <span style="font-size:15px;color:var(--muted);margin-right:6px;">${user.email ? user.email : "User"}</span>
            <span id="userIconClickable" style="display:inline-block;cursor:pointer;vertical-align:middle;">${getUserIcon(36)}</span>
            <div class="user-dropdown-content" id="userDropdownContent">
              <button id="logoutBtn">Logout</button>
            </div>
          </div>
        `;
        // Dropdown logic
        const userIcon = document.getElementById("userIconClickable");
        const dropdown = document.getElementById("userDropdown");
        const dropdownContent = document.getElementById("userDropdownContent");
        userIcon.addEventListener("click", (e) => {
          e.stopPropagation();
          dropdown.classList.toggle("show");
        });
        // Hide dropdown when clicking outside
        document.addEventListener("click", (e) => {
          if (!dropdown.contains(e.target)) {
            dropdown.classList.remove("show");
          }
        });
        // Logout button
        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await signOut(auth);
          window.location.href = "LoginPage.html";
        });
        // Load admin panels
        loadUsers();
        loadReviews();
      } else {
        // Not logged in, redirect to login
        window.location.href = "LoginPage.html";
      }
    });
  </script>
</body>
</html>
