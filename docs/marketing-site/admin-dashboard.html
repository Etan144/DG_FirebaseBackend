<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Deepfake Guard</title>

  <!-- Global theme -->
  <link rel="stylesheet" href="style.css" />
  <!-- Admin layout -->
  <link rel="stylesheet" href="admin-dashboard.css" />
</head>

<body class="admin-page">
  <div class="admin-container">
    <header class="admin-header">
      <a href="index.html" class="admin-brand">
        <div class="admin-logo">DG</div>
        <div>
          <div style="font-weight:800;">Deepfake Guard</div>
          <div style="color:var(--muted);font-size:12px;">Admin Dashboard</div>
        </div>
      </a>
      <div id="user-icon-container"></div>
    </header>

    <div class="admin-page-header">
      <h1>Admin Dashboard</h1>
      <p>Overview of platform activity and moderation tools.</p>
    </div>

    <!-- STATS -->
    <div class="stats-dashboard" id="stats-dashboard"></div>

    <!-- USER MANAGEMENT -->
    <section class="admin-section">
      <div class="section-header">
        <h2>👥 User Management</h2>
      </div>

      <div class="section-body">
        <div class="toolbar">
          <div class="search-box">
            <input id="userSearch" type="text" placeholder="🔍 Search by email" />
          </div>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Status</th>
              <th style="width:240px;">Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- REVIEW MANAGEMENT -->
    <section class="admin-section">
      <div class="section-header">
        <h2>⭐ Review Management</h2>
      </div>

      <div class="section-body">
        <div class="toolbar">
          <input
            id="reviewSearch"
            type="text"
            class="filter-select"
            placeholder="🔍 Search review text"
            style="min-width:220px"
          />

          <select id="reviewRatingFilter" class="filter-select">
            <option value="">All Ratings</option>
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐ & up</option>
            <option value="3">⭐⭐⭐ & up</option>
            <option value="2">⭐⭐ & up</option>
            <option value="1">⭐ & up</option>
          </select>
        </div>

        <div id="reviews-list" class="review-list"></div>
      </div>
    </section>

    <footer style="color:var(--muted);font-size:12px;text-align:center;padding:16px 0;">
      &copy; 2024 Deepfake Guard. All rights reserved.
    </footer>
  </div>

  <script type="module" src="admin-dashboard.js?v=5"></script>
</body>
</html>
