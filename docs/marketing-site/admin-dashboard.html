<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Deepfake Guard</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin-dashboard.css" />
</head>

<body class="admin-page">
  <div class="admin-container">

    <header class="admin-header">
      <a href="index.html" class="admin-brand">
        <div class="admin-logo">DG</div>
        <div>
          <div style="font-weight:800;">Deepfake Guard</div>
          <div style="color:var(--muted);font-size:12px;">Admin Dashboard</div>
        </div>
      </a>
      <div id="user-icon-container"></div>
    </header>

    <div class="admin-page-header">
      <h1>Admin Dashboard</h1>
      <p>Platform overview, moderation and health metrics.</p>
    </div>

    <!-- OVERVIEW -->
    <h3 class="section-title">Overview</h3>
    <div class="stats-dashboard" id="stats-overview"></div>

    <!-- USER STATS -->
    <h3 class="section-title">User Accounts</h3>
    <div class="stats-dashboard" id="stats-users"></div>

    <!-- REVIEW STATS -->
    <h3 class="section-title">User Reviews</h3>
    <div class="stats-dashboard" id="stats-reviews"></div>

    <!-- USER MANAGEMENT -->
    <section class="admin-section">
      <div class="section-header">
        <h2>👥 User Management</h2>
      </div>

      <div class="section-body">
        <div class="toolbar">
          <div class="search-box">
            <input id="userSearch" type="text" placeholder="🔍 Search by email" />
          </div>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Status</th>
              <th style="width:240px;">Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- REVIEW MANAGEMENT -->
    <section class="admin-section">
      <div class="section-header">
        <h2>⭐ Review Management</h2>
      </div>

      <div class="section-body">
        <div class="toolbar">
          <input id="reviewSearch" class="filter-select" placeholder="🔍 Search review text" />
          <select id="reviewRatingFilter" class="filter-select">
            <option value="">All Ratings</option>
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐ & up</option>
            <option value="3">⭐⭐⭐ & up</option>
            <option value="2">⭐⭐ & up</option>
            <option value="1">⭐ & up</option>
          </select>
        </div>

        <div id="reviews-list" class="review-list"></div>
      </div>
    </section>

    <!-- AUDIT LOG -->
    <section class="admin-section">
      <div class="section-header">
        <h2>📜 Audit Log</h2>
      </div>

      <div class="section-body">
        <div class="toolbar">
          <input id="auditSearch" class="filter-select" placeholder="🔍 Search action/target/user" />
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Admin</th>
              <th>Action</th>
              <th>Target</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="audit-tbody"></tbody>
        </table>
      </div>
    </section>

    <footer style="color:var(--muted);font-size:12px;text-align:center;padding:16px 0;">
      &copy; 2024 Deepfake Guard. All rights reserved.
    </footer>
  </div>

  <!-- keep JS here, NOT inside HTML body -->
  <script type="module" src="admin-dashboard.js?v=7"></script>
</body>
</html>
